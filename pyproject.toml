[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-league-market-monitor"
version = "0.4.0"
description = "Terminal EPL Polymarket market monitor and personal bet analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4.2,<5",
  "nbconvert>=7,<8",
  "nbformat>=5,<6",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
]

[project.scripts]
premier-league-report = "polymarket_bot.report_cli:main"
bet-analytics = "polymarket_bot.analytics_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-league-market-monitor"
version = "0.3.0"
description = "Terminal EPL Polymarket order-book and Pinnacle odds monitor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
premier-league-report = "polymarket_bot.report_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
